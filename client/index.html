<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Applies the saved theme before first paint (external file: CSP is script-src 'self') -->
    <script src="/theme-init.js"></script>
    <link rel="icon" type="image/png" href="/icon-only-favicon.png" />
    <link rel="apple-touch-icon" href="/icon-only-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Fundamental — the serious fundraising platform and private-market network. Every startup opens with a 12-minute video pitch." />
    <meta name="robots" content="index, follow" />
    <link rel="manifest" href="/manifest.json" />
    <!-- The wordmark is the LCP element on the landing/login pages (both always
         use the dark-background lockup) — fetch it before React discovers it. -->
    <link rel="preload" as="image" href="/logo-dark.png" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking font load: media="print" defers it off the render path, onload
         flips it live. A slow or offline network (native cold start!) must never
         hold first paint hostage — system fonts stand in until the swap. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" /></noscript>
    <title>Fundamental — Fundraising? Fundamental.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
