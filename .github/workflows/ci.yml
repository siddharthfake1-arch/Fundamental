name: CI
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install root deps
        run: npm install
      - name: Build client
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Security audit (production deps)
        run: npm audit --omit=dev || true
