name: CI
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install root deps
        run: npm install
      - name: Build client
        run: npm run build
      - name: Run tests (unit + route/permission)
        run: npm test
      # F-033/F-007: audits are BLOCKING (high/critical) for both root and client.
      - name: Security audit — production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Security audit — client (dev tooling included)
        run: npm audit --prefix client --audit-level=high
